name: Build and Publish to PyPI

on:
  push:
    tags:
      - 'v*'
  # Validate release builds without creating a release or uploading to PyPI.
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        architecture: x64

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build pytest

    - name: Build package
      run: python -m build

    - name: Test packaged source and platform locks
      run: python -m pytest --confcutdir=tests/packaging tests/packaging -q

    - uses: actions/upload-artifact@v4
      with:
        name: quack-release-${{ matrix.os }}
        path: dist/*
        if-no-files-found: error

  build-and-publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    # Both platforms validate the universal wheel; publish one copy with the sdist.
    - uses: actions/download-artifact@v5
      with:
        name: quack-release-ubuntu-latest
        path: dist

    - name: Install publishing dependencies
      run: python -m pip install twine

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        files: dist/*
        generate_release_notes: true

    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        twine upload dist/*
