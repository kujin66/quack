name: CI (PR)

on:
  pull_request:
    branches: [main]
  pull_request_target:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  # github.ref is per-PR for pull_request events but collapses to refs/heads/main
  # for pull_request_target — keying on the PR number keeps both unique per PR.
  group: ci-pr-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Same-repository PRs use pull_request; external PRs retain the target path.
    if: >
      github.event_name == 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    uses: ./.github/workflows/_test.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
      environment: gpu-ci
